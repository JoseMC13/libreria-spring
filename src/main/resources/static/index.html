<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Librer&iacute;a The Bookshelf in the Cloud</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .contenedor {
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>
    <img src="img/logo.jpg" alt="Logo Librer&iacute;a" style="height:100px; vertical-align:middle; margin-right:10px;">
    Librer&iacute;a The Bookshelf in the Cloud
</h1>

<div class="contenedor">

    <div class="panel">
        <h2>Libros Disponibles</h2>
        <ul id="listaLibros">
            <li>Los libros aparecer&aacute;n aqu&iacute;...</li>
        </ul>
    </div>

    <div class="panel">
        <h2>Carrito</h2>
        <ul id="carrito">
            <li>Tu carrito est&aacute; vac&iacute;o</li>
        </ul>
        <button onclick="finalizarCompra()">Finalizar Compra</button>
    </div>

</div>

<script>
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    const API_BASE = "https://REEMPLAZA-ESTA-URL.onrender.com";
    const API_URL = API_BASE && API_BASE !== "https://REEMPLAZA-ESTA-URL.onrender.com"
        ? API_BASE.replace(/\/$/, "")
        : "";

    actualizarCarrito();

    const libros = [
        {
            titulo: "El Principito",
            precio: 10.99,
            imagen: "elprincipito.jpg",
            sinopsis: "Un piloto conoce a un pequeno principe en el desierto."
        },
        {
            titulo: "Cien Anos de Soledad",
            precio: 15.50,
            imagen: "cienaniosdesoledad.jpg",
            sinopsis: "Historia de la familia Buendia en Macondo."
        },
        {
            titulo: "Clean Code",
            precio: 40.00,
            imagen: "cleancode.jpg",
            sinopsis: "Guia para escribir codigo limpio y profesional."
        }
    ];

    const lista = document.getElementById("listaLibros");
    lista.innerHTML = "";

    libros.forEach(libro => {
        const li = document.createElement("li");

        const img = document.createElement("img");
        img.src = "img/" + libro.imagen;
        img.width = 80;
        img.style.verticalAlign = "middle";
        img.style.marginRight = "10px";

        const texto = document.createElement("span");
        texto.textContent = libro.titulo + " - $" + libro.precio + " ";

        const boton = document.createElement("button");
        boton.textContent = "Agregar";
        boton.onclick = () => agregarAlCarrito(libro);

        li.appendChild(img);
        li.appendChild(texto);
        li.appendChild(boton);

        lista.appendChild(li);
    });

    function agregarAlCarrito(libro) {
        carrito.push(libro);
        actualizarCarrito();
    }

    function actualizarCarrito() {
        const listaCarrito = document.getElementById("carrito");
        listaCarrito.innerHTML = "";

        if (carrito.length === 0) {
            listaCarrito.innerHTML = "<li>Tu carrito est&aacute; vac&iacute;o</li>";
            return;
        }

        let total = 0;

        carrito.forEach((libro, index) => {
            const li = document.createElement("li");
            li.textContent = libro.titulo + " - $" + libro.precio + " ";

            const botonEliminar = document.createElement("button");
            botonEliminar.textContent = "X";
            botonEliminar.onclick = () => {
                carrito.splice(index, 1);
                actualizarCarrito();
            };

            li.appendChild(botonEliminar);
            listaCarrito.appendChild(li);

            total += libro.precio;
        });

        const totalElemento = document.createElement("li");
        totalElemento.innerHTML = "<strong>Total: $" + total.toFixed(2) + "</strong>";
        listaCarrito.appendChild(totalElemento);

        localStorage.setItem("carrito", JSON.stringify(carrito));
    }

    function finalizarCompra() {
        if (carrito.length === 0) {
            alert("Tu carrito esta vacio.");
            return;
        }

        const items = agruparCarrito();

        fetch((API_URL ? API_URL : "") + "/compra/comprobante", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ items })
        })
            .then(respuesta => {
                if (!respuesta.ok) {
                    return respuesta.text().then(texto => {
                        throw new Error("Error " + respuesta.status + ": " + texto);
                    });
                }
                return respuesta.blob();
            })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "comprobante.pdf";
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);

                alert("Gracias por tu compra!");
                carrito = [];
                actualizarCarrito();
            })
            .catch(error => {
                alert("No se pudo generar el comprobante. " + error.message);
            });
    }

    function agruparCarrito() {
        const mapa = new Map();
        carrito.forEach(libro => {
            const clave = libro.titulo;
            if (!mapa.has(clave)) {
                mapa.set(clave, {
                    titulo: libro.titulo,
                    precioUnitario: libro.precio,
                    cantidad: 0
                });
            }
            mapa.get(clave).cantidad += 1;
        });
        return Array.from(mapa.values());
    }

</script>

</body>
</html>
